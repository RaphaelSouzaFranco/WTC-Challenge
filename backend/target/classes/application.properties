# ============================================================
# WTC Challenge Backend — application.properties
# ============================================================

# Porta do servidor
server.port=8080

# ============================================================
# MongoDB — altere a URI conforme seu ambiente
# ============================================================
spring.data.mongodb.uri=mongodb+srv://wtcadmin:Wtc2026%40Mongo@nicolly0.agcoxnf.mongodb.net/wtcdb?appName=Nicolly0

spring.data.mongodb.database=wtcdb

# ============================================================
# Upload de Arquivos (Mídia de Mensagens e Campanhas)
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Diretório local para armazenar uploads
app.upload.dir=uploads

# ============================================================
# JWT — substitua pelo seu secret em produção
# ============================================================
app.jwt.secret=wtcChallenge_SuperSecretKey_ChangeInProduction_2024!
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ============================================================
# Logging
# ============================================================
logging.level.com.wtc=DEBUG
logging.level.org.springframework.data.mongodb=INFO

# ============================================================
# Actuator (opcional — monitoramento)
# ============================================================
management.endpoints.web.exposure.include=health,info
